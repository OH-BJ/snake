<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포즈 뱀게임</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2129; --line: #2a333d; --text: #e6edf3; --muted: #8b949e;
    --snake: #3fb950; --head: #7ee787; --food: #ff7b72; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Malgun Gothic", sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
  h1 { width: 100%; text-align: center; margin: 4px 0; font-size: 22px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  #game { display: block; background: #0b0f13; border-radius: 8px; width: 100%; max-width: 480px; aspect-ratio: 1; }
  .side { width: 300px; display: flex; flex-direction: column; gap: 12px; }
  #cam { display: block; width: 100%; aspect-ratio: 1; background: #000; border-radius: 8px; }
  .stats { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 18px; }
  .bar { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 14px; }
  .bar span:first-child { width: 60px; }
  .bar .track { flex: 1; height: 14px; background: var(--line); border-radius: 7px; overflow: hidden; }
  .bar .fill { height: 100%; width: 0; background: var(--muted); transition: width .1s; }
  .bar.active .fill { background: var(--accent); }
  .bar .pct { width: 42px; text-align: right; color: var(--muted); }
  button { background: var(--accent); color: #0b0f13; border: 0; border-radius: 8px; padding: 10px 14px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  label { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  input[type=range] { flex: 1; }
  #status { font-size: 14px; color: var(--muted); min-height: 20px; }
  #dir { font-size: 32px; text-align: center; }
  @media (max-width: 820px) { .side { width: 100%; max-width: 480px; } }
</style>
</head>
<body>
<main>
  <h1>🐍 포즈로 조종하는 뱀게임</h1>

  <section class="panel" style="flex:1; max-width:510px; min-width:280px">
    <div class="stats"><span>점수: <b id="score">0</b></span><span>최고: <b id="best">0</b></span></div>
    <canvas id="game" width="480" height="480"></canvas>
  </section>

  <aside class="side">
    <div class="panel">
      <canvas id="cam" width="200" height="200"></canvas>
      <div id="dir">–</div>
      <div id="bars"></div>
      <div id="status">"웹캠 시작"을 눌러주세요</div>
    </div>
    <div class="panel" style="display:flex; flex-direction:column; gap:10px">
      <div class="row">
        <button id="camBtn">웹캠 시작</button>
        <button id="playBtn">게임 시작</button>
      </div>
      <label>신뢰도 기준 <input id="thr" type="range" min="0.5" max="0.99" step="0.01" value="0.8"><span id="thrVal">0.80</span></label>
      <label>속도 <input id="spd" type="range" min="80" max="400" step="10" value="220"><span id="spdVal">220ms</span></label>
      <label><input id="wrap" type="checkbox" checked> 벽 통과</label>
      <div style="font-size:13px; color:var(--muted)">키보드 방향키 / 스페이스(일시정지)도 사용 가능</div>
    </div>
  </aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
<script>
const MODEL_URL = "https://teachablemachine.withgoogle.com/models/Ea-ai6NIQ/";
const ARROWS = { up: "⬆️", down: "⬇️", left: "⬅️", right: "➡️", neutral: "⏺️" };
const VEC = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

// ---------- 포즈 인식 ----------
let model, webcam, labels = [];
const camCtx = document.getElementById("cam").getContext("2d");
const statusEl = document.getElementById("status");
const barsEl = document.getElementById("bars");
const dirEl = document.getElementById("dir");
const thrEl = document.getElementById("thr");

document.getElementById("camBtn").onclick = async (e) => {
  e.target.disabled = true;
  try {
    statusEl.textContent = "모델 불러오는 중...";
    model = await tmPose.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
    labels = model.getClassLabels();
    barsEl.innerHTML = labels.map((l, i) =>
      `<div class="bar" id="bar${i}"><span>${ARROWS[l.toLowerCase()] || ""} ${l}</span><div class="track"><div class="fill"></div></div><span class="pct">0%</span></div>`
    ).join("");

    statusEl.textContent = "웹캠 켜는 중...";
    webcam = new tmPose.Webcam(200, 200, true);
    await webcam.setup();
    await webcam.play();
    statusEl.textContent = "인식 중";
    e.target.textContent = "웹캠 켜짐";
    requestAnimationFrame(camLoop);
  } catch (err) {
    console.error(err);
    statusEl.textContent = "오류: " + err.message;
    e.target.disabled = false;
  }
};

async function camLoop() {
  webcam.update();
  const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
  const preds = await model.predict(posenetOutput);

  let top = preds[0];
  preds.forEach((p, i) => {
    if (p.probability > top.probability) top = p;
    const bar = document.getElementById("bar" + i);
    bar.querySelector(".fill").style.width = (p.probability * 100) + "%";
    bar.querySelector(".pct").textContent = Math.round(p.probability * 100) + "%";
  });
  preds.forEach((p, i) => document.getElementById("bar" + i).classList.toggle("active", p === top));

  const name = top.className.toLowerCase();
  if (top.probability >= parseFloat(thrEl.value)) {
    dirEl.textContent = ARROWS[name] || name;
    if (VEC[name]) steer(name);
  } else {
    dirEl.textContent = "–";
  }

  camCtx.drawImage(webcam.canvas, 0, 0);
  if (pose) {
    tmPose.drawKeypoints(pose.keypoints, 0.5, camCtx);
    tmPose.drawSkeleton(pose.keypoints, 0.5, camCtx);
  }
  requestAnimationFrame(camLoop);
}

// ---------- 뱀게임 ----------
const GRID = 20, CELL = 24;
const ctx = document.getElementById("game").getContext("2d");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const spdEl = document.getElementById("spd");
const wrapEl = document.getElementById("wrap");
const playBtn = document.getElementById("playBtn");

let snake, dir, nextDir, food, score, timer = null, running = false, over = false;
let best = 0;
try { best = +localStorage.getItem("snakeBest") || 0; } catch (_) {}
bestEl.textContent = best;

function reset() {
  snake = [[10, 10], [9, 10], [8, 10]];
  dir = nextDir = "right";
  score = 0; over = false;
  scoreEl.textContent = 0;
  placeFood();
}

function placeFood() {
  do { food = [Math.floor(Math.random() * GRID), Math.floor(Math.random() * GRID)]; }
  while (snake.some(([x, y]) => x === food[0] && y === food[1]));
}

// 현재 진행 방향의 반대로는 꺾을 수 없음
function steer(d) {
  const [cx, cy] = VEC[dir], [nx, ny] = VEC[d];
  if (cx + nx === 0 && cy + ny === 0) return;
  nextDir = d;
}

function tick() {
  dir = nextDir;
  const [dx, dy] = VEC[dir];
  let x = snake[0][0] + dx, y = snake[0][1] + dy;

  if (wrapEl.checked) { x = (x + GRID) % GRID; y = (y + GRID) % GRID; }
  const hitWall = x < 0 || y < 0 || x >= GRID || y >= GRID;
  const willEat = x === food[0] && y === food[1];
  const body = willEat ? snake : snake.slice(0, -1);
  if (hitWall || body.some(([sx, sy]) => sx === x && sy === y)) return gameOver();

  snake.unshift([x, y]);
  if (willEat) {
    score++;
    scoreEl.textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = "#0b0f13";
  ctx.fillRect(0, 0, 480, 480);
  ctx.strokeStyle = "#141a20";
  for (let i = 0; i <= GRID; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, 480); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(480, i * CELL); ctx.stroke();
  }
  ctx.fillStyle = "#ff7b72";
  ctx.beginPath();
  ctx.arc(food[0] * CELL + CELL / 2, food[1] * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
  ctx.fill();
  snake.forEach(([x, y], i) => {
    ctx.fillStyle = i === 0 ? "#7ee787" : "#3fb950";
    ctx.fillRect(x * CELL + 2, y * CELL + 2, CELL - 4, CELL - 4);
  });
  if (over || !running) {
    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.fillRect(0, 0, 480, 480);
    ctx.fillStyle = "#e6edf3";
    ctx.textAlign = "center";
    ctx.font = "bold 32px system-ui";
    ctx.fillText(over ? "게임 오버" : "일시정지", 240, 230);
    ctx.font = "18px system-ui";
    ctx.fillText(over ? `점수 ${score} · 게임 시작을 눌러 재시작` : "게임 시작 버튼 / 스페이스", 240, 265);
  }
}

function start() {
  if (over) reset();
  running = true;
  playBtn.textContent = "일시정지";
  clearInterval(timer);
  timer = setInterval(tick, +spdEl.value);
}

function pause() {
  running = false;
  clearInterval(timer);
  playBtn.textContent = "게임 시작";
  draw();
}

function gameOver() {
  over = true;
  if (score > best) {
    best = score;
    bestEl.textContent = best;
    try { localStorage.setItem("snakeBest", best); } catch (_) {}
  }
  pause();
}

playBtn.onclick = () => running ? pause() : start();

spdEl.oninput = () => {
  document.getElementById("spdVal").textContent = spdEl.value + "ms";
  if (running) { clearInterval(timer); timer = setInterval(tick, +spdEl.value); }
};
thrEl.oninput = () => document.getElementById("thrVal").textContent = (+thrEl.value).toFixed(2);

document.addEventListener("keydown", (e) => {
  const k = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" }[e.key];
  if (k) { e.preventDefault(); steer(k); }
  if (e.code === "Space") { e.preventDefault(); running ? pause() : start(); }
});

reset();
draw();
</script>
</body>
</html>
